name: verify-revoke-evidence

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  evidence:
    name: evidence-gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Assert exact head
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$EXPECTED_HEAD_SHA" ]; then
            echo "::error::Evidence gate checked $actual, expected PR head $EXPECTED_HEAD_SHA"
            exit 1
          fi
          echo "exact_head=$actual"

      - name: Install repository dependencies
        run: python -m pip install -q -r requirements.txt

      - name: Verify repository configuration
        run: python ./scripts/verify_config.py

      - name: Run repository test suite
        run: python -m pytest tests/ -q
